<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Song</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    </head>
    <body>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-6 offset-3">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="card">
                            <h4 class="card-header">Update Song — {{ song.title }}</h4>
                            <div class="card-body">

                                {% if messages %}
                                    <div class="col-12 mb-3">
                                        {% for msg in messages %}
                                            <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
                                                {{ msg }}
                                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}

                                <div class="row">
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="title" class="form-label">Title</label>
                                            <input type="text" class="form-control" name="title" id="title"
                                                value="{{ song.title }}" placeholder="Enter song title" required />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="duration" class="form-label">Duration (seconds)</label>
                                            <input type="number" class="form-control" name="duration" id="duration"
                                                value="{{ song.duration }}" placeholder="e.g., 180" required />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="generation_status" class="form-label">Generation Status</label>
                                            <select class="form-select" name="generation_status" id="generation_status">
                                                <option value="pending" {% if song.generation_status == 'pending' %}selected{% endif %}>Pending</option>
                                                <option value="success" {% if song.generation_status == 'success' %}selected{% endif %}>Success</option>
                                                <option value="failed" {% if song.generation_status == 'failed' %}selected{% endif %}>Failed</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="user" class="form-label">Linked User (Optional)</label>
                                            <div class="form-control p-0 border-0">
                                                {{ form.user }}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-2">
                                    <button type="submit" class="btn btn-primary">Update</button>
                                    <a href="{% url 'read_song' %}" class="btn btn-secondary">Cancel</a>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
