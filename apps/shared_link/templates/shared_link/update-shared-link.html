<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Shared Link</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-8 offset-2">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="card">
                            <h4 class="card-header">Update Shared Link</h4>
                            <div class="card-body">

                                {% if messages %}
                                    <div class="col-12 mb-3">
                                        {% for msg in messages %}
                                            <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show">
                                                {{ msg }}
                                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}

                                <div class="row">
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="shared_url" class="form-label">Shared URL</label>
                                            <input type="text" class="form-control" name="shared_url" id="shared_url"
                                                value="{{ link.shared_url }}" placeholder="Enter URL" required />
                                        </div>
                                    </div>

                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="expired_date" class="form-label">Expiration Date & Time</label>
                                            <input type="datetime-local" class="form-control" name="expired_date" id="expired_date" 
                                                value="{{ link.expired_date|date:'Y-m-d\TH:i' }}" required />
                                        </div>
                                    </div>

                                    <div class="col-12">
                                        <div class="mb-3">
                                            <label class="form-label">Linked Song</label>
                                            <div class="form-control p-0 border-0">{{ form.song }}</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-2">
                                    <button type="submit" class="btn btn-primary">Update</button>
                                    <a href="{% url 'read_shared_link' %}" class="btn btn-secondary">Cancel</a>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
