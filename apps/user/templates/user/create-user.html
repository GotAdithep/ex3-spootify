<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create User</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    </head>
    <body>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-6 offset-3">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="card">
                            <h4 class="card-header">Create User</h4>
                            <div class="card-body">
                                
                                {% if messages %}
                                    <div class="col-12 mb-3">
                                        {% for msg in messages %}
                                            <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
                                                {{ msg }}
                                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}

                                <div class="row">
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="username" class="form-label">username</label>
                                            <input type="text" class="form-control" name="username" id="username" placeholder="enter username" />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="email" class="form-label">email</label>
                                            <input type="email" class="form-control" name="email" id="email" placeholder="enter email" />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="first_name" class="form-label">first name</label>
                                            <input type="text" class="form-control" name="first_name" id="first_name" placeholder="enter firstname" />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="last_name" class="form-label">last name</label>
                                            <input type="text" class="form-control" name="last_name" id="last_name" placeholder="enter lastname" />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="daily_gen_count" class="form-label">daily gen count</label>
                                            <input type="number" class="form-control" name="daily_gen_count" id="daily_gen_count" placeholder="enter gen count limit per day" />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="password" class="form-label">password</label>
                                            <input type="password" class="form-control" name="password" id="password" placeholder="enter password" />
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
