<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Delete User</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-6 offset-3">
                    <div class="card border-danger">
                        <h4 class="card-header bg-danger text-white">Confirm Deletion</h4>
                        <div class="card-body text-center py-4">
                            
                            <h5 class="card-title text-danger mb-3">Are you sure you want to delete this user?</h5>
                            <p class="card-text">
                                You are about to permanently delete the user <strong>{{ user.username }}</strong> 
                                ({{ user.email }}). This action cannot be undone.
                            </p>

                            <form method="POST" class="mt-4">
                                {% csrf_token %}
                                <div class="d-flex justify-content-center gap-3">
                                    <a href="{% url 'read_user' %}" class="btn btn-secondary px-4">Cancel</a>
                                    <button type="submit" class="btn btn-danger px-4">Yes, Delete User</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
