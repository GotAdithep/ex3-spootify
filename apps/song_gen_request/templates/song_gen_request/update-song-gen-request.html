<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Update Song Gen Request</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container-fluid mt-4">
            <div class="row">
                <div class="col-8 offset-2">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="card">
                            <h4 class="card-header">Update Request — {{ req.song_title }}</h4>
                            <div class="card-body">

                                {% if messages %}
                                    <div class="col-12 mb-3">
                                        {% for msg in messages %}
                                            <div class="alert {% if msg.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show">
                                                {{ msg }}
                                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                            </div>
                                        {% endfor %}
                                    </div>
                                {% endif %}

                                <div class="row">
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label for="song_title" class="form-label">Song Title</label>
                                            <input type="text" class="form-control" name="song_title" id="song_title"
                                                value="{{ req.song_title }}" placeholder="Enter title" required />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label class="form-label">Singer Voice Type</label>
                                            <input type="text" class="form-control" name="singer_voice_type"
                                                value="{{ req.singer_voice_type }}" placeholder="e.g., Male, Female, Robot" required />
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label class="form-label">Mood</label>
                                            <div class="form-control p-0 border-0">{{ form.mood }}</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label class="form-label">Genre</label>
                                            <div class="form-control p-0 border-0">{{ form.genre }}</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label class="form-label">Occasion</label>
                                            <div class="form-control p-0 border-0">{{ form.occasion }}</div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="mb-3">
                                            <label class="form-label">Linked Song</label>
                                            <div class="form-control p-0 border-0">{{ form.song }}</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-2">
                                    <button type="submit" class="btn btn-primary">Update</button>
                                    <a href="{% url 'read_song_gen_request' %}" class="btn btn-secondary">Cancel</a>
                                </div>

                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
