{% load static %}
<header>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <div class="logo">
                    <i class="bi bi-music-note text-white"></i>
                </div>
                <span class="fw-bold text-white ms-3">Ai Music Studio</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item px-3">
                        <i class="bi bi-house-door text-white-50 fs-4"></i>
                        <a class="ms-2 text-white-50 text-decoration-none" href="/">Home</a>
                    </li>
                    <li class="nav-item px-3">
                        <i class="bi bi-music-note-list text-white-50 fs-4"></i>
                        <a class="ms-2 text-white-50 text-decoration-none" href="{% url 'library' %}">Library</a>
                    </li>

                    {% if request.user.is_authenticated %}
                        <li class="nav-item px-3 d-flex align-items-center">
                            <i class="bi bi-person-circle text-white-50 fs-4"></i>
                            <span class="ms-2 text-white-50">{{ request.user.username }}</span>
                        </li>
                    {% endif %}
                </ul>

                {% if request.user.is_authenticated %}
                    <a href="{% url 'logout' %}" class="btn btn-outline-light ms-3">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-primary ms-3">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
