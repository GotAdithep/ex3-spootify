{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
        <link rel="stylesheet" href="{% static 'bootstrap-icons/font/bootstrap-icons.min.css' %}" />
        <link rel="stylesheet" href="{% static 'css/global.css' %}" />
        <link rel="stylesheet" href="{% static 'css/home.css' %}" />
    </head>
    <body class="bg-body" style="height: 100vh">
        <header>
            <nav class="navbar navbar-expand-lg">
                <div class="container">
                    <a class="navbar-brand d-flex align-items-center" href="#">
                        <div class="logo">
                            <i class="bi bi-music-note text-white"></i>
                        </div>
                        <span class="fw-bold text-white ms-3">Ai Music Studio</span>
                    </a>

                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item px-3">
                                <i class="bi bi-house-door text-white-50 fs-4"></i>
                                <a class="ms-2 text-white-50 text-decoration-none" href="#">Home</a>
                            </li>

                            <li class="nav-item px-3">
                                <i class="bi bi-person text-white-50 fs-4"></i>
                                <a class="ms-2 text-white-50 text-decoration-none" href="#">login</a>
                            </li>
                        </ul>
                        <button class="btn btn-primary ms-3" href="#" role="button">signup</button>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <section id="hero" class="hero">
                <div class="container">
                    <div class="row">
                        <div class="offset-3 col-6 text-center">
                            <h1 class="mb-3">Create Music with AI</h1>
                            <p class"mb-4" class="fs-5 text-white-50">Transform your ideas into unique songs. Just describe the mood, and let AI compose your next masterpiece.</p>
                            <div>
                                <button class="btn btn-primary me-3 py-2 px-4">Start Creating</button>
                                <button class="btn btn-dark py-2 px-4">View Library</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <section id="service"></section>
        </main>
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    </body>
</html>
